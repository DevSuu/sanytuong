# Cấu hình proxy dùng chung cho sanytuong.utt.edu.vn
# Cài vào: /etc/nginx/snippets/utt-proxy.conf

# Ảnh upload được nén ở trình duyệt; 10 MB là đủ dư
client_max_body_size 10m;

access_log /var/log/nginx/sanytuong.access.log;
error_log  /var/log/nginx/sanytuong.error.log warn;

location / {
    proxy_pass http://utt_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Ghi đè (không nối thêm) để người dùng không giả mạo được IP,
    # vì ứng dụng giới hạn số request theo IP
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;
    # Không đi qua Cloudflare: xóa header này nếu client tự gửi lên
    proxy_set_header CF-Connecting-IP  "";

    proxy_connect_timeout 10s;
    proxy_read_timeout    120s;   # xuất Excel / đồng bộ Google Sheets có thể lâu
    proxy_send_timeout    120s;
}
