# sanytuong.utt.edu.vn — giai đoạn ĐÃ có SSL (HTTPS, HTTP tự chuyển sang HTTPS)
# Được cài tự động bởi scripts/deploy/enable-ssl.sh

upstream utt_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name sanytuong.utt.edu.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sanytuong.utt.edu.vn;

    ssl_certificate     /etc/nginx/ssl/sanytuong.utt.edu.vn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/sanytuong.utt.edu.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:utt_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # HSTS do ứng dụng tự gửi, không thêm ở đây để tránh trùng header

    include /etc/nginx/snippets/utt-proxy.conf;
}
