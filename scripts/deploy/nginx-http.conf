# sanytuong.utt.edu.vn — giai đoạn CHƯA có SSL (chỉ HTTP)
# Sau khi có chứng chỉ, chạy: sudo bash scripts/deploy/enable-ssl.sh

upstream utt_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name sanytuong.utt.edu.vn;

    include /etc/nginx/snippets/utt-proxy.conf;
}
